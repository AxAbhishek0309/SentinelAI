<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15171C"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA23A"/>
      <stop offset="50%" stop-color="#FF7A18"/>
      <stop offset="100%" stop-color="#F24E00"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Shield Glow Underlay -->
  <path d="M32 10 L48 16 C48 33 40.5 46.5 32 53 C23.5 46.5 16 33 16 16 Z" fill="#FF7A18" opacity="0.3" filter="url(#glow)"/>

  <!-- Shield Shape -->
  <path d="M32 11 L47 16.5 C47 32 40 45 32 51 C24 45 17 32 17 16.5 Z" fill="url(#shieldGrad)"/>

  <!-- Inner Dark Core Shield -->
  <path d="M32 16 L43 20.5 C43 32.5 37.5 41.5 32 46 C26.5 41.5 21 32.5 21 20.5 Z" fill="#0D0F14"/>

  <!-- Center Sentinel AI Radar / Security Eye -->
  <circle cx="32" cy="29" r="6" stroke="#FFA23A" stroke-width="2" fill="none"/>
  <circle cx="32" cy="29" r="2.5" fill="#FFFFFF"/>
  <path d="M32 20 L32 24 M32 34 L32 38 M23 29 L27 29 M37 29 L41 29" stroke="#FFA23A" stroke-width="1.5" stroke-linecap="round"/>
</svg>
