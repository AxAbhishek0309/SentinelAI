# Netlify Production Configuration for Sentinel AI

[build]
  command = "bun run build || npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  BUN_VERSION = "1.2.4"
  NITRO_PRESET = "netlify"

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable Assets Caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static Favicon Caching
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Dynamic SSR Routing via Nitro Netlify Function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
